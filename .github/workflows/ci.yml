# CI do kit de desenvolvimento — perfil web (Next.js + Supabase, npm).
# Todo PR passa por aqui; vermelho bloqueia o merge (configure isso na proteção da branch).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Os nomes das etapas (name) são os mesmos em todos os perfis do kit, porque a proteção
  # da branch exige estas três verificações pelo nome.
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    # Variáveis que o build precisa: cadastre em Settings > Secrets and variables > Actions.
    # env:
    #   NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
    #   NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  specs-e-skills:
    name: Specs e skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validar as specs (OpenSpec)
        run: |
          if [ -d openspec ]; then
            npx --yes @fission-ai/openspec@latest validate --all --no-interactive
          else
            echo "Sem pasta openspec/ ainda; nada a validar."
          fi
      - name: Conferir as cópias das skills
        run: node scripts/kit/verificar-skills.mjs

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSAO: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar o gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      # Num PR, só os commits do PR; na main, o histórico da main. Sem isso o gitleaks olha
      # todas as branches, e um segredo numa branch faz falhar os PRs que não têm nada.
      - name: Procurar segredos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then INTERVALO="$BASE..$HEAD"; else INTERVALO="HEAD"; fi
          ./gitleaks git --redact --verbose --log-opts="$INTERVALO" .
